# Mọi giá trị nhạy cảm đọc từ biến môi trường (xem .env.example ở thư mục gốc).
# Không ghi mật khẩu, khóa hay địa chỉ máy chủ thật vào file này.

spring:
  application:
    name: slm-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slm_ai}
    username: ${DB_USERNAME:slm_ai}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: SlmAiHikariPool
      minimum-idle: 2
      maximum-pool-size: 10

  # Flyway sở hữu schema; Hibernate không được tự sửa bảng.
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: 8080
  # Đọc X-Forwarded-For / X-Forwarded-Proto do nginx gửi để biết IP thật của người dùng
  forward-headers-strategy: framework

app:
  jwt:
    # Chuỗi ngẫu nhiên tối thiểu 32 byte. Sinh bằng: openssl rand -base64 48
    signer-key: ${JWT_SIGNER_KEY:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:8h}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

  # Để trống = không bật CORS (frontend gọi qua proxy cùng tên miền). Nhiều origin cách nhau bằng dấu phẩy.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # Tạo tài khoản SYSTEM_ADMIN đầu tiên khi CSDL chưa có quản trị viên nào. Đăng nhập xong nên đổi mật khẩu.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Quản trị viên}

  minio:
    # Địa chỉ server dùng để tải lên / tải xuống (đi thẳng, không qua proxy)
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Địa chỉ HTTPS trình duyệt / khách dùng để xem media (mục 6.4). Để trống = dùng endpoint.
    public-url: ${MINIO_PUBLIC_URL:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:slm-ai-media}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  packages-to-scan: vn.slmglobal.slmai

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    vn.slmglobal.slmai: INFO
