# Mọi giá trị nhạy cảm đọc từ biến môi trường (xem .env.example ở thư mục gốc).
# Không ghi mật khẩu, khóa hay địa chỉ máy chủ thật vào file này.

spring:
  application:
    name: slm-ai

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slm_ai}
    username: ${DB_USERNAME:slm_ai}
    password: ${DB_PASSWORD:}
    hikari:
      pool-name: SlmAiHikariPool
      minimum-idle: 2
      maximum-pool-size: 10

  # Flyway sở hữu schema; Hibernate không được tự sửa bảng.
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  jackson:
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

server:
  port: 8080
  # Đọc X-Forwarded-For / X-Forwarded-Proto do nginx gửi để biết IP thật của người dùng
  forward-headers-strategy: framework

app:
  jwt:
    # Chuỗi ngẫu nhiên tối thiểu 32 byte. Sinh bằng: openssl rand -base64 48
    signer-key: ${JWT_SIGNER_KEY:}
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:8h}
    refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}

  # Để trống = không bật CORS (frontend gọi qua proxy cùng tên miền). Nhiều origin cách nhau bằng dấu phẩy.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

  # Tạo tài khoản SYSTEM_ADMIN đầu tiên khi CSDL chưa có quản trị viên nào. Đăng nhập xong nên đổi mật khẩu.
  bootstrap-admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    full-name: ${ADMIN_FULL_NAME:Quản trị viên}

  minio:
    # Địa chỉ server dùng để tải lên / tải xuống (đi thẳng, không qua proxy)
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    # Địa chỉ HTTPS trình duyệt / khách dùng để xem media (mục 6.4). Để trống = dùng endpoint.
    public-url: ${MINIO_PUBLIC_URL:}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    bucket: ${MINIO_BUCKET:slm-ai-media}

  # Meta App + Page cho Messenger (mục 54.3). Webhook: https://<tên-miền>/api/v1/webhooks/facebook
  facebook:
    app-id: ${FB_APP_ID:}
    app-secret: ${FB_APP_SECRET:}
    verify-token: ${FB_VERIFY_TOKEN:}
    page-id: ${FB_PAGE_ID:}
    page-access-token: ${FB_PAGE_ACCESS_TOKEN:}
    graph-api-version: ${FB_GRAPH_API_VERSION:v26.0}
    graph-api-base-url: ${FB_GRAPH_API_BASE_URL:https://graph.facebook.com}

  # Hội thoại (mục 19)
  conversation:
    debounce: ${CONVERSATION_DEBOUNCE:6s}
    auto-handback: ${CONVERSATION_AUTO_HANDBACK:24h}
    messaging-window: 24h
    worker-enabled: ${CONVERSATION_WORKER_ENABLED:true}
    worker-batch-size: 50

  # AI trả lời khách (mục 18–20, 33, 35). Thiếu ANTHROPIC_API_KEY thì worker AI không chạy, tin khách vẫn được lưu.
  ai:
    api-key: ${ANTHROPIC_API_KEY:}
    model: ${AI_MODEL:claude-opus-5-5}
    effort: ${AI_EFFORT:medium}
    max-tokens: 8000
    timeout: 120s
    server-side-fallback: true
    # Công tắc dừng toàn cục (mục 33.2): true = mọi lượt đi theo DRAFT
    force-draft: ${AI_FORCE_DRAFT:false}
    worker-enabled: ${AI_WORKER_ENABLED:true}
    worker-concurrency: 4
    history-limit: 40
    max-attempts: 3
    retry-backoff: 20s
    turn-lease: 3m
    typing-indicator: true
    company-name: ${AI_COMPANY_NAME:SolarMax}
    # Tên tư vấn viên khi tự giới thiệu; khách hỏi thẳng có phải bot không thì AI vẫn nói thật (core/identity)
    persona-name: ${AI_PERSONA_NAME:Huyền}
    auto-intents: CHAO_HOI,TU_VAN_LAP_MOI,HOI_GIA,GIAI_THICH,CHINH_SACH
    handoff-intents: KY_THUAT_SU_CO,KHIEU_NAI
    business-hours:
      zone: Asia/Ho_Chi_Minh
      start: "08:00"
      end: "17:30"
      days: MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY
    templates:
      out-of-hours-ack: "Dạ em đã ghi nhận thông tin của mình ạ. Nhân viên tư vấn sẽ phản hồi mình trong giờ làm việc sớm nhất nhé."
      handoff-ack: "Dạ em đã chuyển thông tin cho nhân viên phụ trách, anh/chị chờ em một chút nhé."
      ack-cooldown: 12h

  # Thông báo cho nhân viên trên trang admin (chuông, âm thanh, thông báo trình duyệt qua SSE)
  notification:
    window: 14d
    heartbeat: 20s
    stream-timeout: 30m
    max-connections-per-user: 5

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_ENABLED:true}
  packages-to-scan: vn.slmglobal.slmai

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    vn.slmglobal.slmai: INFO
